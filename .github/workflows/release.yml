name: Build Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/fazenda-keystore.jks

      - name: Extract version from tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Update version.properties
        shell: bash
        run: |
          OLD_CODE=$(grep -oP 'VERSION_CODE=\K\d+' app/version.properties || echo "0")
          echo "VERSION_CODE=$((OLD_CODE + 1))" > app/version.properties
          echo "VERSION_NAME=$VERSION" >> app/version.properties

      - name: Build and sign APK
        env:
          FAZENDA_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease -x lintVitalAnalyzeRelease

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/Fazenda-v$VERSION.apk"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/Fazenda-v*.apk
          generate_release_notes: true
